<!doctype html><html><head><meta charset="UTF-8"><title>VANTA ATC</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#e8eef7;font:13px system-ui,Segoe UI,sans-serif}button,input,select{font:inherit}.shell{height:100vh;display:grid;grid-template-columns:235px 1fr}.side{background:#0a1626;border-right:1px solid #1b2a3c;padding:18px}.logo{font-size:22px;font-weight:900;letter-spacing:3px}.sub{color:#6f8298;font-size:9px;letter-spacing:1.5px;margin:3px 0 25px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;color:#8498ad;font-size:10px;letter-spacing:.7px}.field input,.field select{background:#081523;color:#fff;border:1px solid #294059;border-radius:6px;padding:9px}.connect{width:100%;padding:10px;background:#e8eef7;color:#07111f;border:0;border-radius:6px;font-weight:800;cursor:pointer}.connect.off{background:#6b2833;color:#fff}.main{display:grid;grid-template-rows:64px 1fr 240px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #1b2a3c;background:#0a1626}.pos{font-weight:800;letter-spacing:1px}.status{color:#71849a}.status.live{color:#8fe0a9}.content{display:grid;grid-template-columns:1fr 340px;min-height:0}.radar{position:relative;background:#0a1421;overflow:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(4,120px);grid-auto-rows:95px;gap:14px;min-width:600px;min-height:500px;background-image:linear-gradient(#142338 1px,transparent 1px),linear-gradient(90deg,#142338 1px,transparent 1px);background-size:60px 60px;border:1px solid #1b2a3c;position:relative}.plane{position:absolute;width:140px;background:#0c1a2cdd;border:1px solid #36506b;border-radius:6px;padding:8px;cursor:pointer}.plane b{font-size:13px}.plane small{display:block;color:#8194a9;margin-top:3px}.data{display:flex;gap:8px;font-size:9px;color:#a8bbcf;margin-top:6px}.panel{border-left:1px solid #1b2a3c;background:#0a1626;overflow:auto;padding:16px}.panel h3{font-size:10px;letter-spacing:1.4px;color:#8094aa}.aircraft{padding:11px 0;border-top:1px solid #1b2a3c}.aircraft b{font-size:14px}.aircraft span{float:right;color:#a9bdd2;font-family:monospace}.aircraft small{display:block;color:#72859b;margin-top:4px}.bottom{border-top:1px solid #1b2a3c;background:#091524;overflow:auto;padding:14px 20px}.bottom h3{font-size:10px;letter-spacing:1.4px;color:#8194aa;margin:0 0 10px}.row{display:grid;grid-template-columns:110px 90px 90px 120px 1fr;gap:15px;padding:8px 0;border-top:1px solid #17273a}.muted{color:#70839a}.ok{color:#8fe0a9}.warn{color:#ffbb70}@media(max-width:1000px){.shell{grid-template-columns:180px}.content{grid-template-columns:1fr}.panel{display:none}}
</style></head><body><div class="shell"><aside class="side"><div class="logo">VANTA</div><div class="sub">AIR TRAFFIC CONTROL</div><div class="field"><span>AIRPORT ICAO</span><input id="icao" value="EIDW" maxlength="4"></div><div class="field"><span>POSITION</span><select id="position"><option>TWR</option><option>GND</option><option>DEL</option><option>APP</option><option>DEP</option><option>CTR</option></select></div><div class="field"><span>FREQUENCY</span><input id="freq" value="118.600"></div><button id="connect" class="connect">CONNECT ATC</button><hr style="border:0;border-top:1px solid #1b2a3c;margin:20px 0"><div class="muted">Live VANTA aircraft and filed flight plans appear automatically when pilots connect.</div></aside><main class="main"><header class="top"><div><div id="pos" class="pos">EIDW_TWR</div><div id="freqText" class="muted">118.600 MHz</div></div><div id="status" class="status">DISCONNECTED</div></header><section class="content"><div class="radar"><div id="radar" class="grid"></div></div><aside class="panel"><h3>LIVE AIRCRAFT <span id="count">0</span></h3><div id="aircraft"></div></aside></section><section class="bottom"><h3>ACTIVE FLIGHT PLANS</h3><div id="plans"></div></section></main></div><script>
const RT='http://localhost:4001';let snap={aircraft:[],flightPlans:[],atcFrequencies:[]};let ws=null,connected=false;const $=id=>document.getElementById(id);function render(){const a=snap.aircraft;$('count').textContent=a.length;$('aircraft').innerHTML=a.map(x=>`<div class="aircraft"><b>${x.callsign}</b><span>${Math.round(x.altitudeFeet).toLocaleString()} ft</span><small>${x.aircraftType||'UNKNOWN'} · ${x.groundSpeedKts?Math.round(x.groundSpeedKts):'—'} kt · HDG ${Math.round(x.headingDegrees).toString().padStart(3,'0')}°</small><small>VS ${x.verticalSpeedFpm?Math.round(x.verticalSpeedFpm):0} fpm · SQK ${x.transponderCode||'—'} · COM1 ${x.com1?.active?.toFixed(3)||'—'}</small></div>`).join('')||'<div class="muted">No aircraft connected.</div>';$('plans').innerHTML=snap.flightPlans.map(p=>`<div class="row"><b>${p.callsign}</b><span>${p.aircraftType}</span><span>${p.departureIcao} → ${p.destinationIcao}</span><span>${p.flightRules} FL${Math.round(p.cruiseAltitudeFeet/100)}</span><span class="muted">${p.route||'Direct'}</span></div>`).join('')||'<div class="muted">No filed flight plans.</div>';const r=$('radar');r.innerHTML='';a.forEach((x,i)=>{const left=30+(i%5)*180,top=30+(Math.floor(i/5)%4)*115;const d=document.createElement('div');d.className='plane';d.style.left=left+'px';d.style.top=top+'px';d.innerHTML=`<b>${x.callsign}</b><small>${x.aircraftType||'UNKNOWN'}</small><div class="data"><span>${Math.round(x.altitudeFeet)} FT</span><span>${x.groundSpeedKts?Math.round(x.groundSpeedKts):'—'} KT</span></div>`;r.appendChild(d);});}
async function poll(){try{const r=await fetch(RT+'/snapshot',{cache:'no-store'});if(r.ok){snap=await r.json();render()}}catch{}}function connect(){if(ws){ws.close();ws=null;connected=false;update();return}ws=new WebSocket('ws://localhost:4001/realtime');ws.onopen=()=>{connected=true;update();ws.send(JSON.stringify({protocol:'VANTA/1',ts:Date.now(),type:'DEV_AUTH',role:'ATC',clientName:'vanta-atc'}));setTimeout(()=>{const icao=$('icao').value.toUpperCase(),position=$('position').value,f=Number($('freq').value);ws.send(JSON.stringify({protocol:'VANTA/1',ts:Date.now(),type:'ATC_CONNECT',icao,positionType:position,frequencyMhz:f}))},100)};ws.onclose=()=>{connected=false;update()}}function update(){const pc=$('icao').value.toUpperCase()+'_'+$('position').value;$('pos').textContent=pc;$('freqText').textContent=Number($('freq').value).toFixed(3)+' MHz';$('status').textContent=connected?'CONNECTED':'DISCONNECTED';$('status').className='status '+(connected?'live':'');$('connect').textContent=connected?'DISCONNECT ATC':'CONNECT ATC';$('connect').className='connect '+(connected?'off':'')}
$('connect').onclick=connect;['icao','position','freq'].forEach(x=>$(x).oninput=update);update();poll();setInterval(poll,1000);
</script><script src="./voice-client.js">
const vantaRadio=new VantaRadio({url:RT.replace(/^http/,'ws')+'/realtime',role:'ATC',getFrequency:()=>Number($("freq").value),getCallsign:()=>($("icao").value||'EIDW')+'_'+($("position").value||'TWR'),onStatus:s=>{$("radioStatus").textContent=s}});
document.addEventListener('pointerdown',e=>{if(e.target&&e.target.id==='ptt'){e.preventDefault();vantaRadio.startPtt()}},true);
document.addEventListener('pointerup',e=>{if(e.target&&e.target.id==='ptt'){e.preventDefault();vantaRadio.stopPtt()}},true);
document.addEventListener('pointercancel',()=>vantaRadio.stopPtt(),true);
</script></body></html>
